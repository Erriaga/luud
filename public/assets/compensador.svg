<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente da borda prateada/platinada do escudo -->
    <linearGradient id="shield-rim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gradiente do interior roxo/índigo místico -->
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Chama azul de restauração -->
    <linearGradient id="blue-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Sombra de profundidade inferior -->
  <path d="M 64 14 L 106 28 L 106 64 C 106 94, 86 112, 64 122 C 42 112, 22 94, 22 64 L 22 28 Z" fill="#0F172A" />

  <!-- Corpo externo do escudo -->
  <path d="M 64 10 L 106 24 L 106 60 C 106 90, 86 108, 64 118 C 42 108, 22 90, 22 60 L 22 24 Z" fill="url(#shield-rim)" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Interior do escudo -->
  <path d="M 64 19 L 97 30 L 97 60 C 97 85, 81 100, 64 109 C 47 100, 31 85, 31 60 L 31 30 Z" fill="url(#shield-bg)" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Chama azul centralizada (mesma silhueta do streak, simbolizando proteção da sequência) -->
  <path d="M 64 34 C 64 34, 81 50, 81 68 C 81 79, 73 87, 64 87 C 55 87, 47 79, 47 68 C 47 61, 51 54, 55 50 C 54 55, 56 59, 59 59 C 56 50, 60 40, 64 34 Z" fill="url(#blue-flame)" stroke="#0C4A6E" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Núcleo branco da chama azul -->
  <path d="M 64 58 C 64 58, 71 65, 71 73 C 71 79, 68 83, 64 83 C 60 83, 57 79, 57 73 C 57 65, 64 58, 64 58 Z" fill="#FFFFFF" />

  <!-- Seta circular de "Restaurar / Voltar" no canto inferior direito -->
  <circle cx="90" cy="92" r="18" fill="#10B981" stroke="#022C22" stroke-width="2.5" />
  <path d="M 96 88 A 8 8 0 1 0 97 95" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  <polygon points="99,83 99,91 91,90" fill="#FFFFFF" />
</svg>