<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente da borda externa -->
    <linearGradient id="gold-rim" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="35%" stop-color="#F5B800" />
      <stop offset="75%" stop-color="#B87300" />
      <stop offset="100%" stop-color="#7A4900" />
    </linearGradient>

    <!-- Gradiente do miolo rebaixado -->
    <linearGradient id="gold-inner" x1="85%" y1="85%" x2="15%" y2="15%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#D99400" />
      <stop offset="100%" stop-color="#8F5900" />
    </linearGradient>

    <!-- Gradiente da estrela central -->
    <linearGradient id="gold-star" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF8CC" />
      <stop offset="45%" stop-color="#FFD11A" />
      <stop offset="100%" stop-color="#B37400" />
    </linearGradient>

    <!-- Brilho especular superior -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sombra projetada inferior (espessura 3D sutil) -->
  <circle cx="64" cy="68" r="56" fill="#593300" />

  <!-- Base metálica externa -->
  <circle cx="64" cy="64" r="56" fill="url(#gold-rim)" stroke="#4D2C00" stroke-width="2.5" />

  <!-- Anel de destaque interno -->
  <circle cx="64" cy="64" r="45" fill="url(#gold-inner)" stroke="#FFE680" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Detalhes pontilhados na borda interna -->
  <circle cx="64" cy="64" r="41" fill="none" stroke="#663D00" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5" />

  <!-- Estrela em relevo -->
  <polygon points="64,34 72.5,51.2 91.5,54 77.7,67.4 81,86.3 64,77.4 47,86.3 50.3,67.4 36.5,54 55.5,51.2" fill="url(#gold-star)" stroke="#663D00" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Reflexo de luz na parte superior -->
  <path d="M 24 44 A 46 46 0 0 1 104 44 A 52 38 0 0 0 24 44 Z" fill="url(#shine)" />
</svg>