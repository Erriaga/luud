services:
  - type: web
    name: luud
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PIX_GATEWAY
        value: mercadopago
      - key: PUBLIC_URL
        value: https://luud.com.br
      - key: PIX_API_TOKEN
        sync: false
      - key: PIX_WEBHOOK_SECRET
        sync: false
